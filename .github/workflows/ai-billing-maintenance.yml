name: AI Billing Maintenance

on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

concurrency:
  group: ai-billing-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile billing and discover Google models
        run: |
          BODY=$(curl -sS -L --connect-timeout 10 --max-time 240 -w '\n__STATUS__%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/ai-billing-maintenance")
          RESPONSE=$(echo "$BODY" | tail -1 | sed 's/__STATUS__//')
          RESPONSE_BODY=$(echo "$BODY" | head -n -1)
          echo "HTTP status: $RESPONSE"
          echo "Response: $RESPONSE_BODY"
          [ "$RESPONSE" = "200" ] || exit 1