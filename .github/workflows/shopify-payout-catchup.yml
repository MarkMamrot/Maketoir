name: Shopify Payout Catch-up

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  catch-up:
    runs-on: ubuntu-latest
    steps:
      - name: Poll paid Shopify payouts
        run: |
          RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/xero/shopify-payouts/catchup-cron")
          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || exit 1