name: Runtime Issues Daily Digest

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send unresolved runtime issues digest
        run: |
          RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/admin/runtime-issues/digest-cron")
          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || exit 1