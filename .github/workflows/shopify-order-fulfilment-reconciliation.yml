name: Shopify Order Fulfilment Reconciliation

on:
  schedule:
    - cron: '47 16 * * *'
  workflow_dispatch:

concurrency:
  group: shopify-order-fulfilment-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reconcile fully fulfilled Shopify orders
        run: |
          BODY=$(curl -s -L -w '\n__STATUS__%{http_code}' \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/ims/shopify/orders/reconcile-fulfilments-cron")
          RESPONSE=$(echo "$BODY" | tail -1 | sed 's/__STATUS__//')
          RESPONSE_BODY=$(echo "$BODY" | head -n -1)
          echo "HTTP status: $RESPONSE"
          echo "Response: $RESPONSE_BODY"
          [ "$RESPONSE" = "200" ] || exit 1