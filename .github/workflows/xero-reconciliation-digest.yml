name: Xero Reconciliation Digest

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send due Xero reconciliation digests
        run: |
          RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/xero/reconciliation/digest-cron")
          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || exit 1
