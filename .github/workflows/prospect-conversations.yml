name: Prospect Conversation Maintenance

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain prospect conversations and lead alerts
        run: |
          RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/cron/prospect-conversations")
          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || exit 1