name: CI (build & test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: npm test

      - name: Verify fresh IMS schema provisioning
        run: npm test -- --run src/lib/ims/__tests__/provisionBusiness.integration.test.ts
        env:
          RUN_IMS_SCHEMA_INTEGRATION: '1'
          MYSQL_HOST: 127.0.0.1
          IMS_MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
          MYSQL_DATABASE: mysql

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

  shopify-loyalty-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-loyalty
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shopify-loyalty/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Run extension unit tests
        run: npm test

      - name: Typecheck extension
        run: npm run typecheck

      - name: Build extension bundle
        run: npm run build
